<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User — Reserve Spot</title>
    <style>
        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(120deg, #ff8008, #ffc837);
        }

        header {
            padding: 18px 0;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .spots-container {
            width: 95vw;
            max-width: 1400px;
            display: grid;
            grid-template-columns: repeat(3, 300px);
            grid-auto-rows: 150px;
            gap: 16px;
            justify-content: center;
            padding: 20px;
        }

        .spot {
            width: 300px;
            height: 150px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            background: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform .12s ease, background .12s ease;
            position: relative;
        }

            .spot:hover {
                transform: translateY(-4px);
            }

        .spot-number {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 4px;
            color: #000;
        }

        .spot-meta {
            font-size: 12px;
            opacity: 0.9;
            color: #000;
        }

        .badge {
            position: absolute;
            top: 6px;
            left: 6px;
            font-size: 11px;
            padding: 3px 6px;
            border-radius: 6px;
            background: rgba(0,0,0,0.25);
            color: #fff;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 30;
            align-items: center;
            justify-content: center;
        }

            .modal.show {
                display: flex;
            }

        .modal-box {
            width: 380px;
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

            .modal-box h2 {
                margin: 0 0 8px 0;
                font-size: 18px;
                color: #000;
            }

        .modal-row {
            margin-top: 10px;
        }

            .modal-row label {
                display: block;
                font-size: 13px;
                margin-bottom: 6px;
                color: #000;
            }

            .modal-row input[type="text"], .modal-row select {
                width: 80%;
                padding: 8px 10px;
                border-radius: 6px;
                border: 2px solid #ff8209;
                color: #000;
            }

        .btn {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            background: #e87200;
            color: #fff;
            font-weight: 700;
        }

            .btn.secondary {
                background: #555;
                color: #fff;
                margin-left: 8px;
            }

        /* Color palette */
        .color-palette {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #ccc;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

            .color-swatch:hover {
                transform: scale(1.1);
            }

            .color-swatch.selected {
                border-color: #ff8209;
                box-shadow: 0 0 6px #ff8209;
            }

        @media (max-width: 1024px) {
            .spots-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: 150px;
            }

            .spot {
                width: 100%;
            }
        }

        @media (max-width: 768px) {
            .spots-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                padding: 10px;
            }

            .spot {
                height: 130px;
            }

            .modal-box {
                width: 90%;
                max-width: 320px;
                padding: 14px;
            }
        }

        @media (max-width: 480px) {
            .spots-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .spot {
                width: 100%;
                height: 130px;
            }

            .modal-box {
                width: 90%;
                padding: 12px;
            }

            .btn {
                width: 100%;
                margin-top: 10px;
            }

                .btn.secondary {
                    margin-left: 0;
                }
        }
    </style>
</head>
<body>
    <header>
        <h1>Alege un loc — Rezervă-ți mesajul</h1>
        <div style="font-size:16px;opacity:0.9;">Sunt permise mai multe rezervări pe același loc. Mesajele vor fi afișate în ordine.</div>
    </header>

    <main>
        <div class="spots-container" id="spotsContainer"></div>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-box">
            <h2>Rezervă locul <span id="modalSpotNumber"></span></h2>
            <div class="modal-row">
                <label for="msg">Mesaj</label>
                <input id="msg" type="text" placeholder="Scrieți textul dorit" maxlength="40">
            </div>
            <div class="modal-row">
                <label>Culoare text:</label>
                <div id="colorPalette" class="color-palette">
                    <div class="color-swatch selected" data-color="#000000" style="background:#000000"></div>
                    <div class="color-swatch" data-color="#ff0000" style="background:#ff0000"></div>
                    <div class="color-swatch" data-color="#00ff00" style="background:#00ff00"></div>
                    <div class="color-swatch" data-color="#0000ff" style="background:#0000ff"></div>
                    <div class="color-swatch" data-color="#ffcc00" style="background:#ffcc00"></div>
                    <div class="color-swatch" data-color="#ff00ff" style="background:#ff00ff"></div>
                </div>
                <input type="hidden" id="textColor" value="#000000">
            </div>
            <div class="modal-row">
                <label for="duration">Durată</label>
                <select id="duration">
                    <option value="10">10 secunde — 4.99 RON</option>
                    <option value="30">30 secunde — 12.99 RON</option>
                </select>
            </div>
            <div style="margin-top:12px;">
                <button id="payBtn" class="btn">Plătește și trimite (simulat)</button>
                <button id="cancelBtn" class="btn secondary">Anulează</button>
            </div>
        </div>
    </div>

    <script>
        const spotsContainer = document.getElementById('spotsContainer');
        const modal = document.getElementById('modal');
        const modalSpotNumber = document.getElementById('modalSpotNumber');
        const msgInput = document.getElementById('msg');
        const durationSelect = document.getElementById('duration');
        const payBtn = document.getElementById('payBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const colorPalette = document.getElementById('colorPalette');
        const colorHiddenInput = document.getElementById('textColor');

        const SPOT_COUNT = 9;
        let selectedSpot = null;

        function createGrid() {
            for (let i = 0; i < SPOT_COUNT; i++) {
                const el = document.createElement('div');
                el.className = 'spot';
                el.dataset.index = i;
                el.innerHTML = `<div class="badge"></div>
                      <div class="spot-number">Spot ${i + 1}</div>
                      <div class="spot-meta">Disponibil</div>`;
                el.addEventListener('click', () => openModal(i));
                spotsContainer.appendChild(el);
            }
        }

        function computeSpotInfo(spotIndex, queue) {
            const items = queue.filter(it => it.spotIndex === spotIndex && it.status !== 'completed');
            if (!items.length) return { status: 'available', count: 0 };

            const showing = items.find(it => it.status === 'showing');
            if (showing) return { status: 'showing', count: items.length };
            const approved = items.find(it => it.status === 'approved');
            if (approved) return { status: 'approved', count: items.length };
            const pending = items.find(it => it.status === 'pending');
            if (pending) return { status: 'pending', count: items.length };
            return { status: 'declined', count: items.length };
        }

        async function refreshSpots() {
            try {
                const res = await fetch('/queue');
                const queue = await res.json();
                for (let i = 0; i < SPOT_COUNT; i++) {
                    const el = spotsContainer.children[i];
                    const meta = el.querySelector('.spot-meta');
                    const badge = el.querySelector('.badge');
                    const info = computeSpotInfo(i, queue);

                    el.className = 'spot ' + info.status;
                    if (info.status === 'available') {
                        meta.textContent = 'Disponibil';
                        badge.textContent = '';
                    } else {
                        meta.textContent = `${info.status} (${info.count} în coadă)`;
                        badge.textContent = info.count;
                    }
                }
            } catch (e) { console.error(e); }
        }

        function openModal(i) {
            selectedSpot = i;
            modalSpotNumber.textContent = `#${i + 1}`;
            msgInput.value = '';
            durationSelect.value = '10';
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            selectedSpot = null;
        }

        colorPalette.addEventListener('click', e => {
            if (e.target.classList.contains('color-swatch')) {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
                e.target.classList.add('selected');
                colorHiddenInput.value = e.target.dataset.color;
            }
        });

        payBtn.addEventListener('click', async () => {
            const text = msgInput.value.trim();
            const duration = parseInt(durationSelect.value, 10);
            const textColor = colorHiddenInput.value;
            if (!text) return alert('Introduceți un mesaj');
            try {
                await fetch('/queue', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ spotIndex: selectedSpot, text, duration, textColor })
                });
                closeModal();
                refreshSpots();
            } catch (e) {
                console.error(e);
                alert('Trimiterea a eșuat');
            }
        });

        cancelBtn.addEventListener('click', closeModal);

        createGrid();
        refreshSpots();
        setInterval(refreshSpots, 2000);
    </script>
</body>
</html>
