<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TV Display</title>
    <style>
        :root {
            --bg-start: #e0e0e0;
            --bg-mid: #f9f9f9;
            --bg-end: #d0d0d0;
            --card-inactive: rgba(200, 200, 200, 0.1);
            --card-active: rgba(0, 122, 204, 0.2);
            --accent: #007acc;
            --text: #111;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            background: url('lebg.jpg') center center / cover no-repeat;
        }

        header {
            padding: 14px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 20px;
            color: var(--text);
        }

        .spots-container {
            width: 90vw;
            max-width: 1400px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(200px, 1fr);
            gap: 20px;
        }

        .spot {
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--card-inactive);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 1px 6px rgba(0,0,0,0.01);
            opacity: 0;

            width:100%;
            max-width:33%;
        }

            .spot.active {
                border-color: var(--accent);
                background: white;
                box-shadow: 0 0 25px rgba(0, 122, 204, 0.5);
                transform: scale(1.03);
                color: black;
                opacity: 1;
            }

        .spot-text {
            font-weight: 700;
            text-align: center;
            padding: 0 12px;
            font-size: 28px;
            color: #e2e2e2;
            transition: font-size 0.3s ease, color 0.3s ease;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* MAX 2 lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            white-space: normal;
            width: 100%; /* fit box width */
            box-sizing: border-box;
        }

        .spot.active .spot-text {
            font-size: 46px;
        }

        .countdown {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 16px;
            font-weight: bold;
        }

        /* Lights animation */
        .light {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 25px 5px #f0f8ff;
            opacity: 0.8;
            top: 100vh;
        }

        .x1 {
            animation: floatUp 4s infinite linear;
            transform: scale(1.0);
            left: 5%;
        }

        .x2 {
            animation: floatUp 7s infinite linear;
            transform: scale(1.5);
            left: 15%;
        }

        .x3 {
            animation: floatUp 2.5s infinite linear;
            transform: scale(0.6);
            left: 25%;
        }

        .x4 {
            animation: floatUp 4.5s infinite linear;
            transform: scale(1.2);
            left: 35%;
        }

        .x5 {
            animation: floatUp 8s infinite linear;
            transform: scale(2.0);
            left: 45%;
        }

        .x6 {
            animation: floatUp 3s infinite linear;
            transform: scale(0.8);
            left: 55%;
        }

        .x7 {
            animation: floatUp 5.3s infinite linear;
            transform: scale(1.8);
            left: 65%;
        }

        .x8 {
            animation: floatUp 4.7s infinite linear;
            transform: scale(1.3);
            left: 75%;
        }

        .x9 {
            animation: floatUp 4.1s infinite linear;
            transform: scale(0.9);
            left: 85%;
        }

        @keyframes floatUp {
            0% {
                top: 100vh;
                opacity: 0;
            }

            25% {
                opacity: 0.8;
            }

            50% {
                top: 0vh;
                opacity: 0.6;
            }

            75% {
                opacity: 0.8;
            }

            100% {
                top: -100vh;
                opacity: 0;
            }
        }

        @media (max-width:1024px) {
            .spots-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: minmax(160px,1fr);
                gap: 16px;
            }

            .spot-text {
                font-size: 24px;
            }

            .spot.active .spot-text {
                font-size: 30px;
            }
        }

        @media (max-width:768px) {
            .spots-container {
                grid-template-columns: repeat(1,1fr);
                width: 95vw;
                grid-auto-rows: minmax(140px,auto);
                gap: 14px;
            }

            .spot-text {
                font-size: 22px;
            }

            .spot.active .spot-text {
                font-size: 26px;
            }

            header h1 {
                font-size: 18px;
            }
        }

        @media (max-width:480px) {
            .spots-container {
                grid-template-columns: 1fr;
                width: 96vw;
                gap: 12px;
            }

            .spot-text {
                font-size: 20px;
            }

            .spot.active .spot-text {
                font-size: 24px;
            }

            .countdown {
                font-size: 14px;
                top: 6px;
                right: 10px;
            }

            header h1 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>TV Display (Live)</h1>
    </header>

    <main>
        <div class='light x1'></div>
        <div class='light x2'></div>
        <div class='light x3'></div>
        <div class='light x4'></div>
        <div class='light x5'></div>
        <div class='light x6'></div>
        <div class='light x7'></div>
        <div class='light x8'></div>
        <div class='light x9'></div>

        <div class="spots-container" id="spotsContainer"></div>
    </main>

    <script>
        const SPOT_COUNT = 9;
        const spotsContainer = document.getElementById('spotsContainer');
        let active = {}; // active[spotIndex] = { id, remaining, intervalId, timeoutId }

        // Initialize grid
        for (let i = 0; i < SPOT_COUNT; i++) {
            const el = document.createElement('div');
            el.className = 'spot';
            el.innerHTML = `<div class="spot-text">Spot ${i + 1}</div><div class="countdown"></div>`;
            spotsContainer.appendChild(el);
        }

        function clearActive(spotIndex) {
            const a = active[spotIndex];
            if (!a) return;
            if (a.intervalId) clearInterval(a.intervalId);
            if (a.timeoutId) clearTimeout(a.timeoutId);
            delete active[spotIndex];
            const el = spotsContainer.children[spotIndex];
            if (el) {
                el.querySelector('.countdown').textContent = '';
                el.querySelector('.spot-text').style.color = '';
                el.classList.remove('active');
            }
        }

        function startLocalShow(spotIndex, message) {
            clearActive(spotIndex);
            const el = spotsContainer.children[spotIndex];
            const textNode = el.querySelector('.spot-text');
            const cdNode = el.querySelector('.countdown');

            el.classList.add('active');
            textNode.innerText = message.text;
            textNode.style.color = message.textColor || 'black';

            let remaining = Number(message.duration) || 10;
            cdNode.innerText = remaining + 's';

            const intervalId = setInterval(() => {
                remaining--;
                cdNode.innerText = remaining > 0 ? remaining + 's' : '0s';
            }, 1000);

            const timeoutId = setTimeout(async () => {
                try { await fetch(`/queue/${message.id}/completed`, { method: 'POST' }); }
                catch (e) { console.error(e); }
                finally { clearActive(spotIndex); await pollAndStartForSpot(spotIndex); }
            }, remaining * 1000);

            active[spotIndex] = { id: message.id, remaining, intervalId, timeoutId };
        }

        async function pollAndStartForSpot(spotIndex, qArg) {
            const q = qArg || await (await fetch('/queue')).json();
            const showing = q.find(it => it.spotIndex === spotIndex && it.status === 'showing');
            if (showing) { startLocalShow(spotIndex, showing); return; }

            const approved = q.find(it => it.spotIndex === spotIndex && it.status === 'approved');
            if (approved) {
                const p = await fetch(`/queue/${approved.id}/showing`, { method: 'POST' });
                if (p.ok) {
                    const refreshed = (await (await fetch('/queue')).json()).find(it => it.id === approved.id) || approved;
                    startLocalShow(spotIndex, refreshed);
                }
                return;
            }

            const el = spotsContainer.children[spotIndex];
            el.classList.remove('active');
            el.querySelector('.spot-text').innerText = `Spot ${spotIndex + 1}`;
            el.querySelector('.countdown').innerText = '';
        }

        async function pollQueue() {
            const q = await (await fetch('/queue')).json();
            for (let i = 0; i < SPOT_COUNT; i++) {
                if (active[i]) {
                    const a = active[i];
                    const serverItem = q.find(it => it.id === a.id);
                    if (!serverItem || serverItem.status === 'completed') clearActive(i);
                    else continue;
                }
                await pollAndStartForSpot(i, q);
            }
        }

        setInterval(pollQueue, 2000);
        pollQueue();
    </script>
</body>
</html>
