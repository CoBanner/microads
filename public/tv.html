<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TV Display</title>
    <style>
        :root {
            --bg-start: #e0e0e0;
            --bg-mid: #f9f9f9;
            --bg-end: #d0d0d0;
            --card-inactive: rgba(200, 200, 200, 0.1);
            --card-active: rgba(0, 122, 204, 0.2);
            --accent: #007acc;
            --text: #111;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            background: url('lebg.jpg') center center / cover no-repeat;
        }

        header {
            display: block;
            text-align: left;
            max-width: 220px;
            background: white;
            border-bottom-right-radius: 60px;
            opacity: 0.85;
            padding: 8px 12px;
        }

        .powered-inline {
            font-size: 16px;
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .spots-container {
            width: 90vw;
            max-width: 1400px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: minmax(200px, 1fr);
            gap: 20px;
            grid-auto-rows: 200px;
        }

        .spot {
            border: 1px solid rgba(0, 0, 0, 0.1);
            background: var(--card-inactive);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 1px 6px rgba(0,0,0,0.01);
            opacity: 0;
            width: 100%;
        }

            .spot.active {
                border-color: var(--accent);
                background: white;
                box-shadow: 0 0 25px rgba(0, 122, 204, 0.5);
                transform: scale(1.03);
                color: black;
                opacity: 1;
            }

        .spot-text {
            font-weight: 700;
            text-align: center;
            padding: 0 12px;
            font-size: 28px;
            color: #e2e2e2;
            transition: font-size 0.3s ease, color 0.3s ease;
            display: -webkit-box;
            -webkit-line-clamp: 4; /* max lines */
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            white-space: normal;
            width: 100%;


            box-sizing: border-box;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 100%; /* stay within box */
            line-height: 1.1; /* compact spacing */
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .countdown {
            position: absolute;
            top: 8px;
            right: 12px;
            font-size: 16px;
            font-weight: bold;
        }

        /* FONT SIZE CLASSES */
        .text-xl {
            font-size: 90px;
        }
        /* was 138px */
        .text-lg {
            font-size: 86px;
        }
        /* was 98px */
        .text-md {
            font-size: 52px;
        }
        /* was 84px */
        .text-sm {
            font-size: 38px;
        }
        /* was 28px */


        /* COLOR CLASSES */
        .color-black {
            color: black;
        }

        .color-red {
            color: #e53935;
        }

        .color-blue {
            color: #1e88e5;
        }

        .color-green {
            color: #43a047;
        }

        .color-yellow {
            color: #fdd835;
        }

        /* LIGHTS ANIMATION */
        .light {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 25px 5px #f0f8ff;
            opacity: 0.8;
            top: 100vh;
        }

        @keyframes floatUp {
            0% {
                top: 100vh;
                opacity: 0;
            }

            25% {
                opacity: 0.8;
            }

            50% {
                top: 0vh;
                opacity: 0.6;
            }

            75% {
                opacity: 0.8;
            }

            100% {
                top: -100vh;
                opacity: 0;
            }
        }

        .x1 {
            animation: floatUp 4s infinite linear;
            left: 5%;
            transform: scale(1.0);
        }

        .x2 {
            animation: floatUp 7s infinite linear;
            left: 15%;
            transform: scale(1.5);
        }

        .x3 {
            animation: floatUp 2.5s infinite linear;
            left: 25%;
            transform: scale(0.6);
        }

        .x4 {
            animation: floatUp 4.5s infinite linear;
            left: 35%;
            transform: scale(1.2);
        }

        .x5 {
            animation: floatUp 8s infinite linear;
            left: 45%;
            transform: scale(2.0);
        }

        .x6 {
            animation: floatUp 3s infinite linear;
            left: 55%;
            transform: scale(0.8);
        }

        .x7 {
            animation: floatUp 5.3s infinite linear;
            left: 65%;
            transform: scale(1.8);
        }

        .x8 {
            animation: floatUp 4.7s infinite linear;
            left: 75%;
            transform: scale(1.3);
        }

        .x9 {
            animation: floatUp 4.1s infinite linear;
            left: 85%;
            transform: scale(0.9);
        }

        /* Responsive */
        @media (max-width:1024px) {
            .spots-container {
                grid-template-columns: repeat(2, 1fr);
                grid-auto-rows: minmax(160px,1fr);
                gap: 16px;
            }
        }

        @media (max-width:768px) {
            .spots-container {
                width: 95vw;
                gap: 24px;
            }
        }

        @media (max-width:480px) {
            .spots-container {
                grid-template-columns: 1fr;
                width: 96vw;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <header>
        <span class="powered-inline">Powered by</span>
        <img src="cobanner-logo.png" alt="CoBanner Logo" style="max-width:100%;height:auto;">
    </header>

    <main>
        <div class='light x1'></div>
        <div class='light x2'></div>
        <div class='light x3'></div>
        <div class='light x4'></div>
        <div class='light x5'></div>
        <div class='light x6'></div>
        <div class='light x7'></div>
        <div class='light x8'></div>
        <div class='light x9'></div>

        <div class="spots-container" id="spotsContainer"></div>
    </main>

    <script>
        const SPOT_COUNT = 9;
        const spotsContainer = document.getElementById('spotsContainer');
        let active = {};

        for (let i = 0; i < SPOT_COUNT; i++) {
            const el = document.createElement('div');
            el.className = 'spot';
            el.innerHTML = `<div class="spot-text">Spot ${i + 1}</div><div class="countdown"></div>`;
            spotsContainer.appendChild(el);
        }

        function clearActive(spotIndex) {
            const a = active[spotIndex];
            if (!a) return;
            clearInterval(a.intervalId);
            clearTimeout(a.timeoutId);
            delete active[spotIndex];

            const el = spotsContainer.children[spotIndex];
            const textNode = el.querySelector('.spot-text');
            el.querySelector('.countdown').textContent = '';
            el.classList.remove('active');

            // Remove style classes
            textNode.classList.remove('text-xl', 'text-lg', 'text-md', 'text-sm');
            textNode.classList.remove('color-black', 'color-red', 'color-blue', 'color-green', 'color-yellow');

            textNode.innerText = `Spot ${spotIndex + 1}`;
        }

        function applyFontClass(textNode, len) {
            textNode.classList.remove('text-xl', 'text-lg', 'text-md', 'text-sm');
            if (len <= 10) textNode.classList.add('text-xl');
            else if (len <= 20) textNode.classList.add('text-lg');
            else if (len <= 30) textNode.classList.add('text-md');
            else textNode.classList.add('text-sm');
        }

        function applyColorClass(textNode, colorName) {
            textNode.classList.remove('color-black', 'color-red', 'color-blue', 'color-green', 'color-yellow');
            switch (colorName?.toLowerCase()) {
                case 'red': textNode.classList.add('color-red'); break;
                case 'blue': textNode.classList.add('color-blue'); break;
                case 'green': textNode.classList.add('color-green'); break;
                case 'yellow': textNode.classList.add('color-yellow'); break;
                default: textNode.classList.add('color-black');
            }
        }

        function startLocalShow(spotIndex, message) {
            clearActive(spotIndex);
            const el = spotsContainer.children[spotIndex];
            const textNode = el.querySelector('.spot-text');
            const cdNode = el.querySelector('.countdown');

            el.classList.add('active');
            textNode.innerText = message.text;

            applyFontClass(textNode, message.text.length);
            applyColorClass(textNode, message.textColor);

            let remaining = Number(message.duration) || 10;
            cdNode.innerText = remaining + 's';

            const intervalId = setInterval(() => {
                remaining--;
                cdNode.innerText = remaining > 0 ? remaining + 's' : '0s';
            }, 1000);

            const timeoutId = setTimeout(async () => {
                try { await fetch(`/queue/${message.id}/completed`, { method: 'POST' }); }
                catch (e) { console.error(e); }
                finally { clearActive(spotIndex); await pollAndStartForSpot(spotIndex); }
            }, remaining * 1000);

            active[spotIndex] = { id: message.id, remaining, intervalId, timeoutId };
        }

        async function pollAndStartForSpot(spotIndex, qArg) {
            const q = qArg || await (await fetch('/queue')).json();
            const showing = q.find(it => it.spotIndex === spotIndex && it.status === 'showing');
            if (showing) { startLocalShow(spotIndex, showing); return; }

            const approved = q.find(it => it.spotIndex === spotIndex && it.status === 'approved');
            if (approved) {
                const p = await fetch(`/queue/${approved.id}/showing`, { method: 'POST' });
                if (p.ok) {
                    const refreshed = (await (await fetch('/queue')).json()).find(it => it.id === approved.id) || approved;
                    startLocalShow(spotIndex, refreshed);
                }
                return;
            }

            clearActive(spotIndex);
        }

        async function pollQueue() {
            const q = await (await fetch('/queue')).json();
            for (let i = 0; i < SPOT_COUNT; i++) {
                if (active[i]) {
                    const a = active[i];
                    const serverItem = q.find(it => it.id === a.id);
                    if (!serverItem || serverItem.status === 'completed') clearActive(i);
                    else continue;
                }
                await pollAndStartForSpot(i, q);
            }
        }

        setInterval(pollQueue, 2000);
        pollQueue();
    </script>
</body>
</html>
