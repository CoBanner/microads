<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panou Admin</title>
    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .queue-item {
            background: #222;
            border: 1px solid cyan;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .queue-item.completed {
                background: #333;
                color: #888;
                border-color: #555;
            }

            .queue-item .status-label {
                font-weight: bold;
                margin-left: 10px;
            }

            .queue-item button {
                margin-left: 10px;
                cursor: pointer;
            }

        /* Login screen */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #loginBox {
            background: #222;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

            #loginBox input {
                padding: 8px;
                border: 1px solid #555;
                border-radius: 4px;
                background: #111;
                color: white;
            }

            #loginBox button {
                padding: 8px;
                background: cyan;
                color: #111;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

        #adminPanel {
            display: none;
        }

        #error {
            color: red;
            font-size: 13px;
        }

        /* Top controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

            .controls button {
                padding: 8px 12px;
                border: none;
                background: crimson;
                color: white;
                border-radius: 4px;
                cursor: pointer;
                font-weight: bold;
            }

                .controls button:hover {
                    background: #d11a2a;
                }
    </style>
</head>
<body>

    <!-- Login screen -->
    <div id="loginScreen">
        <div id="loginBox">
            <h2>Autentificare Admin</h2>
            <input type="text" id="username" placeholder="Utilizator">
            <input type="password" id="password" placeholder="Parolă">
            <button id="loginBtn">Login</button>
            <div id="error"></div>
        </div>
    </div>

    <!-- Admin panel -->
    <div id="adminPanel">
        <div class="controls">
            <button id="resetBtn">Resetează Sistemul</button>
        </div>

        <h1>Panou Admin</h1>
        <div id="queueContainer"></div>
    </div>

    <script>
        const loginScreen = document.getElementById('loginScreen');
        const adminPanel = document.getElementById('adminPanel');
        const loginBtn = document.getElementById('loginBtn');
        const errorBox = document.getElementById('error');
        const queueContainer = document.getElementById("queueContainer");
        const resetBtn = document.getElementById("resetBtn");

        // Login logic
        loginBtn.addEventListener('click', () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === 'admin' && pass === 'admin') {
                loginScreen.style.display = 'none';
                adminPanel.style.display = 'block';
                fetchQueue();
                setInterval(fetchQueue, 2000);
            } else {
                errorBox.textContent = "Username sau parolă incorectă!";
            }
        });

        // Reset system logic
        resetBtn.addEventListener('click', async () => {
            if (confirm("Ești sigur că vrei să ștergi toate mesajele și să resetezi sistemul?")) {
                await fetch('/queue', { method: 'DELETE' });
                fetchQueue();
                alert("Sistemul a fost resetat!");
            }
        });

        // Fetch queue
        async function fetchQueue() {
            const res = await fetch('/queue');
            const queue = await res.json();

            queueContainer.innerHTML = "";

            queue.forEach(item => {
                const div = document.createElement("div");
                div.className = "queue-item";

                let statusLabel = '';
                if (item.status === 'pending') statusLabel = '[În așteptare]';
                else if (item.status === 'approved') statusLabel = '[Aprobat]';
                else if (item.status === 'showing') statusLabel = '[În derulare]';
                else if (item.status === 'completed') statusLabel = '[Finalizat]';

                div.innerHTML = `<span>Loc ${item.spotIndex + 1}: ${item.text} — Durată: ${item.duration}s <span class="status-label">${statusLabel}</span></span>`;

                if (item.status === 'completed') {
                    div.classList.add('completed');
                }

                if (item.status === 'pending') {
                    const approveBtn = document.createElement('button');
                    approveBtn.innerText = 'Aprobă';
                    approveBtn.onclick = async () => {
                        await fetch(`/queue/${item.id}/approve`, { method: 'POST' });
                        fetchQueue();
                    };
                    const declineBtn = document.createElement('button');
                    declineBtn.innerText = 'Respinge';
                    declineBtn.onclick = async () => {
                        await fetch(`/queue/${item.id}/decline`, { method: 'POST' });
                        fetchQueue();
                    };
                    div.appendChild(approveBtn);
                    div.appendChild(declineBtn);
                }

                queueContainer.appendChild(div);
            });
        }
    </script>
</body>
</html>
